  <text x="72" y="485" fill="#fff" font-family="Arial, sans-serif" font-size="66" font-weight="900" letter-spacing="-2">CREATIVE ECONOMY</text>
  <text x="72" y="540" fill="#fde68a" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">LAGOS · ABUJA · ONLINE</text>
  <text x="1040" y="600" fill="#fff" fill-opacity=".8" font-family="Arial, sans-serif" font-size="82" font-weight="900" text-anchor="middle">04</text>
